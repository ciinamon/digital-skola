<!DOCTYPE html>
<html>
  <head>
  <title>Star Pattern Generator</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
        width: 300px;
      }

      input {
        padding: 10px;
        width: 70%;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background-color: #0056b3;
      }

      #outputArea {
        margin-top: 20px;
        background-color: #222;
        color: #ffd700;
        padding: 15px;
        border-radius: 4px;
        text-align: left;
        font-family: monospace;
        min-height: 50px;
        white-space: pre-wrap;
      }
        
      .error {
        color: #ff4d4d;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div class="card">
        <h2>Star Generator</h2>
        <p>How many lines of stars?</p>
        
        <input type="number" id="numInput" placeholder="Enter a number (e.g. 5)" min="1">
        <br>
        <button onclick="printStars()">Generate Stars</button>

        <div id="outputArea"></div>
    </div>

    <script>
      function printStars() {
        const inputElement = document.getElementById("numInput");
        const outputElement = document.getElementById("outputArea");
        const limit = parseInt(inputElement.value);

        outputElement.innerHTML = "";
        outputElement.classList.remove("error");

        if (isNaN(limit) || limit <= 0) {
          outputElement.textContent = "Please enter a valid number greater than 0.";
          outputElement.classList.add("error");
          return;
        }

        if (limit > 100) {
          outputElement.textContent = "That's too many stars! Try less than 100.";
          outputElement.classList.add("error");
          return;
        }

        let finalResult = "";
        for (let i = 1; i <= limit; i++) {
          finalResult += "*".repeat(i) + "\n";
        }
        outputElement.textContent = finalResult;
      }
    </script>
  </body>
</html>
